[project]
name = "pet-embed"
version = "0.1.0"
description = "单图片接口：检测画面中的宠物并输出 384 维归一化特征向量"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.44",
    "ultralytics>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# CPU 版 torch：uv 从这里拉取，避免默认 pypi 装出 GPU wheel（体积大 10 倍）
# 有 GPU 时把下面 index 替换为 nvidia 的 cu121 索引
[[tool.uv.index]]
name = "cpu-torch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "cpu-torch" }
torchvision = { index = "cpu-torch" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
